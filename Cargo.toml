[package]
name = "kanban"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "kanban"
path = "src/main.rs"

[[bin]]
name = "kanban-server"
path = "src/bin/server.rs"
required-features = ["server"]

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = [
    "dep:argon2",
    "dep:axum",
    "dep:rand_core",
    "dep:sha2",
    "dep:sqlx",
    "dep:tokio",
    "dep:tower-http",
    "dep:uuid",
]

[dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["launch", "lib"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

argon2 = { version = "0.5", optional = true }
axum = { version = "0.8", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
sha2 = { version = "0.10", optional = true }
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "runtime-tokio-rustls", "sqlite"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Location", "Window"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
